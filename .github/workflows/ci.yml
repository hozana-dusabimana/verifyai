name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Run the test DB on SQLite — no MySQL service needed in CI.
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ci_test.sqlite3
      SECRET_KEY: ci-secret-not-used-in-prod
      DEBUG: "False"
      AUTO_SEED_DEMO_USERS: "false"
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
          pip install pytest

      - name: Django system check
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # Django's test runner closes its DB connection on teardown and exits
        # cleanly (no lingering pool to force-kill).
        run: python manage.py test --noinput --verbosity 2

  frontend:
    name: Frontend (Vite) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
