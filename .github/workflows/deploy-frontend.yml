name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 98.83.16.194
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/verifyai
            git fetch --prune --force origin main || { git remote prune origin || true; git fetch --force origin main; }
            git reset --hard FETCH_HEAD
            # The prod API base is baked in at build time; rebuild the frontend image.
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build frontend
            docker image prune -f
            # Health-check the PUBLIC https domain.
            code=$(curl -s -o /dev/null -w '%{http_code}' https://verifyai.isiri.rw/)
            echo "public / -> $code"
            test "$code" = "200"
